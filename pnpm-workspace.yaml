allowBuilds:
  "@prisma/engines": false
  esbuild: false
  lefthook: true
  prisma: false
  sharp: false
  workerd: false
overrides:
  # GHSA (high): brace-expansion >= 2.0.0, < 2.1.3
  # 深い推移的依存 (@opennextjs/aws -> @node-minify/core -> glob -> minimatch)
  # なので override で修正版に固定する。
  brace-expansion@2: '^2.1.4'
  # GHSA (high): sharp < 0.35.0
  # next 16.2.11 が optionalDependencies で ^0.34.5 を指定しているため、
  # devDependencies の 0.35.3 に揃える。
  sharp: '^0.35.3'
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # GHSA (high): brace-expansion >= 2.0.0, < 2.1.3
  # 2.1.3 は 2026-07-28 公開で minimumReleaseAge (7日) に引っかかるため一時的に除外。
  # 2026-08-07 以降は不要になるので削除してよい。
  - 'brace-expansion@2.1.4'
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - 'next@16.2.11'
minimumReleaseAgeStrict: true
strictDepBuilds: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
trustPolicyExclude:
  - 'semver@6.3.1'
