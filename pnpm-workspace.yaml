allowBuilds:
  "@prisma/engines": false
  esbuild: false
  lefthook: true
  prisma: false
  sharp: false
  workerd: false
overrides:
  # GHSA (high): brace-expansion >= 2.0.0, < 2.1.3
  # 深い推移的依存 (@opennextjs/aws -> @node-minify/core -> glob -> minimatch)
  # なので override で修正版に固定する。
  brace-expansion@2: '^2.1.4'
  # GHSA (high): sharp < 0.35.0
  # Next と devDependencies の両方で利用する sharp を修正版に揃える。
  sharp: '^0.35.3'
  # GHSA (high): postcss <= 8.5.17
  # 推移的依存も修正版に揃える。
  postcss: '^8.5.23'
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # GHSA (high): brace-expansion >= 2.0.0, < 2.1.3
  # 2.1.3 は 2026-07-28 公開で minimumReleaseAge (7日) に引っかかるため一時的に除外。
  # 2026-08-07 以降は不要になるので削除してよい。
  - 'brace-expansion@2.1.4'
  # Renovate security update: sharp@0.35.5
  - sharp@0.35.5
minimumReleaseAgeStrict: true
strictDepBuilds: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
trustPolicyExclude:
  - 'semver@6.3.1'
